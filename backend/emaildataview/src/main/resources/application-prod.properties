# Production Configuration
spring.application.name=enquiry

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Production optimizations
spring.main.banner-mode=off
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# MongoDB connections (Production)
spring.data.mongodb.uri=mongodb+srv://pereirawedson1996:wedsonpereira@cluster0.5vjwaiv.mongodb.net
spring.data.mongodb.database=emailreplies

# Session configuration for production (HTTPS)
# Cookie must be accessible from root path since frontend is at /
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800

# Trust proxy headers
server.forward-headers-strategy=native

# Security headers
server.error.include-message=never
server.error.include-stacktrace=never

# Logging for production
logging.level.root=WARN
logging.level.com.emails.emaildataview=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.file.name=/var/log/enquiry/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator (for monitoring)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true

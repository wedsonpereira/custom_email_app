<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient1)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Envelope Base -->
  <rect x="96" y="160" width="320" height="240" rx="16" fill="url(#gradient2)" opacity="0.95"/>
  
  <!-- Envelope Flap Shadow -->
  <path d="M 96 160 L 256 280 L 416 160 L 256 200 Z" fill="#4338CA" opacity="0.2"/>
  
  <!-- Envelope Flap -->
  <path d="M 96 160 L 256 280 L 416 160 Z" fill="url(#gradient2)" stroke="#4F46E5" stroke-width="4"/>
  
  <!-- Question Mark Circle -->
  <circle cx="360" cy="340" r="48" fill="#4F46E5"/>
  <circle cx="360" cy="340" r="44" fill="#FFFFFF"/>
  
  <!-- Question Mark -->
  <text x="360" y="365" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#4F46E5" text-anchor="middle">?</text>
  
  <!-- Decorative Lines (representing text in email) -->
  <rect x="130" y="240" width="180" height="8" rx="4" fill="#4F46E5" opacity="0.3"/>
  <rect x="130" y="265" width="140" height="8" rx="4" fill="#4F46E5" opacity="0.3"/>
  <rect x="130" y="290" width="160" height="8" rx="4" fill="#4F46E5" opacity="0.3"/>
</svg>
